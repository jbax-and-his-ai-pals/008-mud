name: Server test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements.lock

      # No torch step: nothing imports torch at module scope. The only torch
      # imports in the engine are inside `LLMInterface._load_model`, after an
      # unconditional early `return`, so the ~1GB CPU wheel this job used to
      # install was never imported by the tests it was paying for. See the note
      # at the bottom of server/requirements.txt.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Each of these both runs and gates on tests.{singles,batch,current}
      # (coverage run's exit code is unittest's) and, together with the
      # `parallel = True` in .coveragerc, produces one combinable data file
      # per root -- so this is the test run, not an extra pass over it.
      - name: Run tests.singles (with coverage)
        run: coverage run -m unittest discover -s tests/singles -p "test_*.py" -t .

      - name: Run tests.batch (with coverage)
        run: coverage run -m unittest discover -s tests/batch -p "test_*.py" -t .

      - name: Run tests.current (with coverage)
        run: coverage run -m unittest discover -s tests/current -p "test_*.py" -t .

      - name: Coverage report
        if: always()
        run: |
          coverage combine
          coverage report
