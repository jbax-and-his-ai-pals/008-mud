name: Server test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements-dev.txt

      - name: Install CPU-only torch
        # engine/ai/ai_manager.py imports torch/transformers unconditionally
        # at module scope (see requirements.txt). Installing the CPU wheel
        # first keeps CI from pulling a multi-GB CUDA build it will never use.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Each of these both runs and gates on tests.{singles,batch,current}
      # (coverage run's exit code is unittest's) and, together with the
      # `parallel = True` in .coveragerc, produces one combinable data file
      # per root -- so this is the test run, not an extra pass over it.
      - name: Run tests.singles (with coverage)
        run: coverage run -m unittest discover -s tests/singles -p "test_*.py" -t .

      - name: Run tests.batch (with coverage)
        run: coverage run -m unittest discover -s tests/batch -p "test_*.py" -t .

      - name: Run tests.current (with coverage)
        run: coverage run -m unittest discover -s tests/current -p "test_*.py" -t .

      - name: Coverage report
        if: always()
        run: |
          coverage combine
          coverage report
